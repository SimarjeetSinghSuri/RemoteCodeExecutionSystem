<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <link rel="icon" href="/images/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<header>
    <nav>
        <div class="left"><a href="/index.html"><img src="/images/codeQuasarlogo.png" alt=""></a></div>
        <div class="right">
            <ul>
                <li class="navhover">Explore</li>
                <li class="navhover">Get started</li>
                <a href="/signin.html"><li class="button2 hoverbutton">Sign in</li></a>
            </ul>
        </div>
    </nav>
</header>

<body>
    <div class="signup-container">
        <img src="/images/fulllogo.png" alt="Logo">
        <form class="signup-form" id="signupForm">
            <label for="email">Username</label>
            <input type="email" id="email" placeholder="Username" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Password" name="password" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" name="confirmPassword" required>

            <label for="emailAddress">E-mail Address</label>
            <input type="email" id="emailAddress" placeholder="E-mail Address" name="emailAddress" required>

            <button type="submit">Sign Up</button>
        </form>
        <div class="bottom">
            <section>Have an account?</section>
            <a href="/signin.html">
                <section class="button3">Sign In</section>
            </a>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
